<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Network TV</title>
    <style>
        /* RESET DE PÁGINA */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    display: flex;
    background-color: #0d0e12;
    color: #ffffff;
    height: 100vh;
    overflow: hidden;
}

/* ESTILO DA BARRA LATERAL */
.sidebar {
    width: 240px;
    background-color: #161822;
    padding: 20px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #252836;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #a855f7; /* Roxo principal */
    margin-bottom: 40px;
    text-align: center;
    letter-spacing: 2px;
}

.menu {
    list-style: none;
}

.menu-item {
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    color: #9ca3af;
    transition: all 0.3s ease;
}

/* Efeito de passar o mouse e aba ativa */
.menu-item:hover, .menu-item.active {
    background-color: #a855f7;
    color: #ffffff;
}

/* ÁREA DO PLAYER/CONTEÚDO */
.content {
    flex: 1;
    padding: 40px;
    overflow-y: auto;
}

/* CONTROLE DE EXIBIÇÃO DAS TELAS */
.tela-section {
    display: none;
}

.tela-section.active {
    display: block;
}

h2 {
    margin-bottom: 25px;
    font-size: 28px;
}

/* CONTAINER DO PLAYER (Mantém a proporção 16:9 na tela) */
.player-container {
    width: 100%;
    max-width: 900px;
    aspect-ratio: 16 / 9;
    background-color: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.player-container iframe {
    width: 100%;
    height: 100%;
}

/* GRID DO CATÁLOGO DE SÉRIES */
.catalogo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 25px;
}

.card-serie {
    background-color: #161822;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s, border-color 0.3s;
    border: 1px solid #252836;
}

.card-serie:hover {
    transform: scale(1.05);
    border-color: #a855f7;
}

.card-serie img {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
}

.card-serie h3 {
    font-size: 16px;
    padding: 12px;
    text-align: center;
}
    </style>
</head>
<body>

    <!-- BARRA LATERAL (MENU) -->
    <nav class="sidebar">
        <div class="logo">SHADOW TV</div>
        <ul class="menu">
            <li class="menu-item active" onclick="mudarAba('sbt')">📺 SBT</li>
            <li class="menu-item" onclick="mudarAba('record')">📰 Record News</li>
            <li class="menu-item" onclick="mudarAba('pluto')">🛸 Pluto TV</li>
            <li class="menu-item" onclick="mudarAba('series')">🎬 Séries</li>
        </ul>
    </nav>

    <!-- ÁREA DO CONTEÚDO PRINCIPAL -->
    <main class="content">
        
        <!-- ABA: SBT -->
        <section id="aba-sbt" class="tela-section active">
            <h2>SBT Ao Vivo</h2>
            <div class="player-container">
               <iframe width="931" height="524" src="https://www.youtube.com/embed/MeQGhKLcU7E" title="SBT Ao Vivo" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="no-referrer-when-downgrade"
 allowfullscreen></iframe>
            </div>
        </section>

        <!-- ABA: RECORD -->
        <section id="aba-record" class="tela-section">
            <h2>Record News Ao Vivo</h2>
            <div class="player-container">
                <iframe src="https://youtube.com" frameborder="0" allowfullscreen></iframe>
            </div>
        </section>

        <!-- ABA: PLUTO TV -->
        <section id="aba-pluto" class="tela-section">
            <h2>Pluto TV Streaming</h2>
            <div class="player-container">
                <iframe src="https://pluto.tv" frameborder="0" allowfullscreen></iframe>
            </div>
        </section>

        <!-- ABA: SÉRIES -->
        <section id="aba-series" class="tela-section">
            <h2>Catálogo de Séries</h2>
            <div class="catalogo-grid">
                <!-- Card de Jujutsu Kaisen com redirecionamento ao clicar -->
                <div class="card-serie" onclick="window.location.href='https://shadowntv.github.io/Jujutsu-TV/'">
                    <h3>Jujutsu Kaisen</h3>
                </div>
            </div>
        </section>


    </main>

    <!-- JAVASCRIPT SIMPLES PARA ALTERNAR AS ABAS -->
    <script>
        function mudarAba(nomeAba) {
            // Esconde todas as seções de conteúdo
            document.querySelectorAll('.tela-section').forEach(tela => {
                tela.classList.remove('active');
            });

            // Remove a marcação de ativo de todos os botões do menu
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });

            // Mostra apenas a seção clicada
            document.getElementById(`aba-${nomeAba}`).classList.add('active');

            // Adiciona a marcação de ativo no botão clicado
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
